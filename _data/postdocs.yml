- name: Maxime Grasser
  info: Postdoctoral Researcher
  photo: maxime.jpg
  number_educ: 4
  education1: PDRA at UoM since 2023
  education2: Previous postdocs at The University of Manchester with Prof. Nicholas F. Chilton (2024-2025) and at Nantes University with Dr Morgane Vacher (2025-2026).
  education3: PhD in Theoretical Chemistry, at the University of Rennes with Prof. Boris Le Guennic (2020-2023).
  education4: Maxime is undertaking a second postdoc at the University of Manchester to simulate X-ray spectra of actinide complexes. His main research focuses on developing and applying novel methods to study optical properties based on multiconfigurationnal electronic structure calculations. He is also interested in magnetic properties and dynamics.
- name: Nicolaj Kofod
  info: Postdoctoral Researcher
  photo: NK_pic1.jpg
  number_educ: 3
  education1: Independent PDRA at UoM since 2023
  education2: PhD in Chemistry, University of Copenhagen, 2023 
  education3: While not ~technically~ part of the Oakley Group, Nicolaj is working closely with Meagan on simulating optical spectra of lanthanides and uranyl. His research interests contains all things light and f-block elements. Currently, he is working on uranyl speciation for nuclear remediation and nuclear waste management. 
