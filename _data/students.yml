  education1: PhD co-supervised with <a href="https://mlbakerlab.co.uk/">Michael Baker</a>
  education2: Lana completed her MChem at Cardiff University with a placement year abroad at the University of Florida. Both projects focused on benchmarking electronic structure theory methods. Her PhD project focuses on modelling X-ray spectra of actinides.

- name: Fathima Thanha Thazhe Namboorikandy
  photo: fathima.jpg
  info: PhD student
  email: fathima.thanha@postgrad.manchester.ac.uk
  number_educ: 2
  education1: PhD co-supervised with <a href="https://millsgroup.weebly.com/">David Mills</a>
  education2: Fathima completed her Masters in Chemistry at the National Institute of Technology, Calicut, Kerala, India. Her master's project focused on electronic structure studies of beryllium-group 13 heterobimetallic dimetallocenes. Her PhD project focuses on defining the electronic structures of (hetero)metallocene anions-He-MAn.

