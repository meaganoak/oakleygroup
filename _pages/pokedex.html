<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TeamDex</title>

  <link rel="stylesheet" href="/css/pokedex.css">
</head>

<body>

<div class="pokedex">

  <div class="left-panel">
    <div class="screen">
      <img id="member-image" src="" alt="" />
    </div>

    <div class="dpad">
      <button id="prev">◀</button>
      <button id="next">▶</button>
    </div>
  </div>

  <div class="right-panel">
    <div class="info-screen">
      <h1 id="member-name"></h1>
      <h2 id="member-role"></h2>
      <p id="member-bio"></p>
    </div>
  </div>

</div>

<script src="/js/pokedex.js"></script>

</body>
</html>
